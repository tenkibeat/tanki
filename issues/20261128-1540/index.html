erous lightning strikes were detected, and Weather Disaster Prevention Bulletins (Tornadoes) were issued."], "jp": ["② 500hPa 5400～5520mで-27℃以下の寒気を伴うトラフが黄海を東進。", "日本海と東～西日本ではトラフ前面で、激しい雨を解析し、発雷を多数検知、気象防災速報(竜巻)を発表。"]}, {"h": true, "ja": "２．主要じょう乱の予想根拠と防災事項を含む解説上の留意点", "en": ["2. Basis for Forecasting Major Disturbances and Discussion Points Including Disaster Prevention Matters"], "jp": ["２．主要じょう乱の予想根拠と防災事項を含む解説上の留意点"]}, {"h": false, "ja": "① 1項① のオホーツク海の低気圧からのびる前線は、28日夜までに北日本を通り千島近海へ進み、次第に日本への影響は小さくなる。1項① の関東の東海上の低気圧は、29日朝までにカムチャツカ半島付近へ進み、前線は29日朝には日本の東へ進む。日本付近は一時的に西高東低の気圧配置となり、28日夜までに日本海で北陸地方を指向するシアーラインが発生し、29日朝にかけて南下し、その後、不明瞭化する。1項② のトラフは、29日夜にかけて本州を通り日本の東へ進み、500hPaでは、北日本で-36℃以下、東～西日本で-30℃以下の平年より約10℃低い寒気が広がる。上空の強い寒気やシアーラインに向かう下層暖湿気の影響で大気の状態が非常に不安定となる所がある。東北地方と北陸地方では29日にかけて、土砂災害、低い土地の浸水、河川の増水に注意・警戒。全国的に29日にかけて、落雷、竜巻などの激しい突風、降ひょう、急な強い雨に注意。低気圧や西高東低の気圧配置の影響で、非常に強い風が吹き、しける所や降雪が強まる所がある。九州北部では29日にかけて、暴風に警戒し、高波に注意・警戒。東北地方と伊豆諸島では29日は、強風、高波に注意・警戒。全国的に29日にかけて、強風、風雪、高波に注意。北～東日本では29日にかけて、大雪による交通障害、着雪に注意。北日本の多雪地では29日にかけて、なだれや融雪にも注意。", "en": ["(1) The front extending from the low over the Sea of Okhotsk mentioned in Section 1(1) will pass through northern Japan and move to waters near the Kuril Islands by the night of the 28th, with its influence on Japan gradually diminishing.", "The low east of Kanto mentioned in Section 1(1) will advance to near the Kamchatka Peninsula by the morning of the 29th, and the front will move east of Japan by the morning of the 29th.", "A winter-type pressure pattern (high to the west, low to the east) will temporarily establish around Japan; a shear line pointing toward the Hokuriku region will develop over the Sea of Japan by the night of the 28th, move southward through the morning of the 29th, and subsequently become indistinct.", "The trough mentioned in Section 1(2) will pass through Honshu and move east of Japan through the night of the 29th, and at 500 hPa, cold air below -36°C over northern Japan and below -30°C over eastern to western Japan—about 10°C lower than normal—will spread.", "Due to the strong cold air aloft and warm, moist air in the lower layers flowing toward the shear line, the atmosphere will become extremely unstable in some places.", "In the Tohoku and Hokuriku regions, watch for or be on high alert for landslides, inundation of low-lying areas, and river swelling through the 29th.", "Nationwide, be alert to lightning strikes, severe gusts such as tornadoes, hail, and sudden downpours through the 29th.", "Under the influence of the low-pressure systems and the winter-type pressure pattern, very strong winds will blow, leading to rough seas and intensifying snowfall in some areas.", "In northern Kyushu, be on high alert for gales and watch for or be on high alert for high waves through the 29th.", "In the Tohoku region and the Izu Islands, watch for or be on high alert for strong winds and high waves on the 29th.", "Nationwide, watch for strong winds, blowing snow, and high waves through the 29th.", "In northern to eastern Japan, watch for traffic disruptions due to heavy snowfall and snow accretion through the 29th.", "In snowy areas of northern Japan, also watch for avalanches and snowmelt through the 29th."], "jp": ["① 1項① のオホーツク海の低気圧からのびる前線は、28日夜までに北日本を通り千島近海へ進み、次第に日本への影響は小さくなる。", "1項① の関東の東海上の低気圧は、29日朝までにカムチャツカ半島付近へ進み、前線は29日朝には日本の東へ進む。", "日本付近は一時的に西高東低の気圧配置となり、28日夜までに日本海で北陸地方を指向するシアーラインが発生し、29日朝にかけて南下し、その後、不明瞭化する。", "1項② のトラフは、29日夜にかけて本州を通り日本の東へ進み、500hPaでは、北日本で-36℃以下、東～西日本で-30℃以下の平年より約10℃低い寒気が広がる。", "上空の強い寒気やシアーラインに向かう下層暖湿気の影響で大気の状態が非常に不安定となる所がある。", "東北地方と北陸地方では29日にかけて、土砂災害、低い土地の浸水、河川の増水に注意・警戒。", "全国的に29日にかけて、落雷、竜巻などの激しい突風、降ひょう、急な強い雨に注意。", "低気圧や西高東低の気圧配置の影響で、非常に強い風が吹き、しける所や降雪が強まる所がある。", "九州北部では29日にかけて、暴風に警戒し、高波に注意・警戒。", "東北地方と伊豆諸島では29日は、強風、高波に注意・警戒。", "全国的に29日にかけて、強風、風雪、高波に注意。", "北～東日本では29日にかけて、大雪による交通障害、着雪に注意。", "北日本の多雪地では29日にかけて、なだれや融雪にも注意。"]}, {"h": false, "ja": "② 29日夜までに華中から高気圧が日本付近へ移動し、30日までに西高東低の気圧配置は解消する。30日夜までに、500hPa 5220m付近で-36℃以下の寒気を伴うトラフに対応した低気圧が、前線を伴いながら沿海州へ東進する。低気圧と日 5 cm; Hokuriku 20 cm; Kinki 10 cm.", "(3) Wave heights (through tomorrow): Izu Islands 5 m; nationwide 4 to 3 m."], "jp": ["① 雨量(18時からの24時間)：北陸100mm。", "② 降雪量(18時からの24時間)：北海道・東北・東海30、関東甲信25、北陸20、近畿10cm。", "③ 波浪(明日まで)：伊豆諸島5、全国的に4～3m。"]}, {"h": true, "ja": "５．全般気象解説情報発表の有無", "en": ["5. Issuance of General Weather Information"], "jp": ["５．全般気象解説情報発表の有無"]}, {"h": false, "ja": "「落雷・突風・降ひょう」を17時頃に発表予定。", "en": ["Information on \"Lightning strikes, gusts, and hail\" is scheduled to be issued around 17:00."], "jp": ["「落雷・突風・降ひょう」を17時頃に発表予定。"]}, {"h": false, "ja": "（注）量的な予報については、今後の状況により変化する場合がありますので、注意報・警報や全般気象情報等に記述する数値を利用願います。", "en": ["(Note) Quantitative forecasts are subject to change depending on future developments; please refer to values stated in advisories, warnings, and General Weather Information."], "jp": ["（注）量的な予報については、今後の状況により変化する場合がありますので、注意報・警報や全般気象情報等に記述する数値を利用願います。"]}], "times": [0.0, 3.05, 9.26, 12.06, 17.03, 20.96, 27.11, 42.94, 56.36, 63.98, 80.25, 93.31, 113.07, 134.98, 145.78, 156.92, 165.13, 176.27, 184.12, 192.59, 198.31, 206.61, 213.36, 223.75, 240.65, 248.97, 254.43, 262.13, 268.56, 273.47, 284.5, 289.13, 296.45, 310.42, 317.21, 320.45, 327.79], "vtimes": [[0.0, 4.87], [5.17, 14.55], [14.85, 21.58], [21.88, 26.9], [27.2, 30.69], [30.99, 38.55], [38.85, 45.79], [46.09, 52.37], [52.67, 56.84], [57.14, 62.91], [63.21, 68.0], [68.3, 72.02], [72.32, 77.75], [78.05, 82.05], [82.35, 86.69], [86.99, 89.94], [90.24, 94.41], [94.71, 99.52], [99.82, 105.18], [105.48, 109.01], [109.31, 112.8], [113.1, 118.44], [118.74, 125.19], [125.49, 128.89], [129.19, 134.28], [134.58, 139.2], [139.5, 145.16]], "audio": true};

if(!HAS){$('pt').textContent='この号の音声は保存期間（1か月）を過ぎました';['play','prev','next','rate'].forEach(i=>$(i).disabled=true)}
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const mark=i=>{if(i===last)return;last=i;spans.forEach(s=>s.classList.toggle('on',+s.dataset.i===i));if(auto&&tab==='read'&&!A.paused&&spans[i])spans[i].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});$('pt').innerHTML=`<b>${i+1} / ${S.length}</b>`;jps.forEach(e=>e.classList.toggle('jon',i>=+e.dataset.a&&i<=+e.dataset.b));cap(i);where()};
const jps=[...document.querySelectorAll('.jp')];
let words=[],wlen=[],wdone=-1,wline=-1;
const cap=i=>{const ws=S[i].split(/\s+/).filter(Boolean);$('now').innerHTML=`<div class="tx" id="tx">${ws.map(w=>`<i>${esc(w)}</i>`).join(' ')}</div>`;words=[...$('tx').children];let c=0;wlen=ws.map(w=>c+=w.length+1);wdone=-1;wline=-1;kara()};
const where=()=>{const h=$('here');const el=spans[last];if(tab!=='read'||last<0||!el||(A.paused&&!A.currentTime)){h.hidden=true;return}const r=el.getBoundingClientRect(),top=document.querySelector('header').getBoundingClientRect().bottom,bot=document.querySelector('.bar').getBoundingClientRect().top;if(r.bottom<top+4){h.textContent=`↑ 読み上げ中（${last+1}/${S.length}）`;h.hidden=false}else if(r.top>bot-4){h.textContent=`↓ 読み上げ中（${last+1}/${S.length}）`;h.hidden=false}else h.hidden=true};
let wq=0;addEventListener('scroll',()=>{if(wq)return;wq=requestAnimationFrame(()=>{wq=0;where()})},{passive:true});addEventListener('resize',where);
$('here').onclick=()=>{spans[last]&&spans[last].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'})};
const idx=t=>{let i=0;while(i+1<T.length&&T[i+1]<=t+0.05)i++;return i};
A.ontimeupdate=()=>{if(A.seeking)return;cur=idx(A.currentTime);mark(cur);$('pb').style.width=(A.duration?A.currentTime/A.duration*100:0)+'%'};
const icon=p=>{$('pi').innerHTML=p?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';$('play').setAttribute('aria-label',p?'一時停止':'再生')};
A.onplay=()=>{icon(true);VA.pause();loop()};A.onpause=A.onended=()=>icon(false);
let raf=0;const kara=()=>{const tx=$('tx');if(!tx||last<0||!words.length)return;const st=T[last],en=last+1<T.length?T[last+1]-0.45:(A.duration||st+5);const f=Math.max(0,Math.min(1,(A.currentTime-st)/Math.max(0.3,en-st)));const tot=wlen[wlen.length-1];let k=0;while(k<wlen.length-1&&wlen[k]<=f*tot)k++;if(f<=0.001)k=-1;else if(f>=0.999)k=words.length-1;if(k!==wdone){words.forEach((w,j)=>w.classList.toggle('d',j<=k));wdone=k}const cur=words[Math.max(0,Math.min(words.length-1,k+1))]||words[0];const top=cur.offsetTop;if(top!==wline){tx.style.transform=`translateY(${-top}px)`;wline=top}};
const loop=()=>{cancelAnimationFrame(raf);const step=()=>{kara();if(!A.paused)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)};
const seek=t=>{if(A.readyState>=1)A.currentTime=t;else A.addEventListener('loadedmetadata',()=>{A.currentTime=t},{once:true})};
const go=i=>{i=Math.max(0,Math.min(S.length-1,i));seek(T[i]);cur=i;last=-1;mark(i);A.play().catch(()=>{})};
$('play').onclick=()=>A.paused?A.play().catch(()=>{}):A.pause();
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
spans.forEach(s=>s.onclick=()=>go(+s.dataset.i));
$('rate').onchange=e=>{rate=+e.target.value;A.playbackRate=rate;
ls.set('tk_rate',rate)};
/* vocab */
let done=new Set(ls.get('tk_learned',[])),flash=false,todo=false,vEnd=0,vBtn=null;
const spk='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9zM16 8a5 5 0 0 1 0 8l-1-1.4a3.3 3.3 0 0 0 0-5.2zM18.5 5a9 9 0 0 1 0 14l-1-1.4a7.2 7.2 0 0 0 0-11.2z"/></svg>';
$('vtab').textContent=`単語帳（${D.vocab.length}）`;
const renderV=()=>{const q=$('q').value.trim().toLowerCase();
  const list=D.vocab.map((v,i)=>({v,i})).filter(({v})=>(!todo||!done.has(v.w))&&(!q||(v.w+v.ja+v.ex).toLowerCase().includes(q)));
  $('vlist').className=flash?'flash':'';
  $('vlist').innerHTML=list.length?list.map(({v,i})=>`<div class="v${done.has(v.w)?' done':''}" data-i="${i}"><div class="vw">${esc(v.w)}</div><div class="vbtn"><button class="say" data-i="${i}" aria-label="${esc(v.w)}の発音">${spk}</button><button class="got" data-i="${i}">${done.has(v.w)?'覚えた✓':'覚えた'}</button></div><div class="vm">${esc(v.pos)} · ${esc(v.ipa)}</div><div class="vb${flash?' hide':''}"><div class="vj">${esc(v.ja)}</div><div class="vx">${esc(v.ex)}</div><div class="vxj">${esc(v.exja)}</div></div></div>`).join(''):'<p class="empty">該当する単語はありません</p>';
  $('cnt').textContent=`${D.vocab.length}語中 ${D.vocab.filter(v=>done.has(v.w)).length}語 覚えた`};
$('vlist').addEventListener('click',e=>{
  const s=e.target.closest('.say'),g=e.target.closest('.got'),c=e.target.closest('.v');
  if(s){if(!HAS)return;const i=+s.dataset.i;A.pause();if(vBtn)vBtn.classList.remove('play');if(vBtn===s&&!VA.paused){VA.pause();vBtn=null;return}vBtn=s;s.classList.add('play');VA.currentTime=VT[i][0];vEnd=VT[i][1];VA.play().catch(()=>{});return}
  if(g){const w=D.vocab[+g.dataset.i].w;done.has(w)?done.delete(w):done.add(w);ls.set('tk_learned',[...done]);renderV();return}
  if(c&&flash)c.querySelector('.vb').classList.toggle('hide')});
VA.ontimeupdate=()=>{if(VA.currentTime>=vEnd){VA.pause()}};
VA.onpause=()=>{if(vBtn){vBtn.classList.remove('play');vBtn=null}};
$('q').oninput=renderV;
$('flashB').onclick=e=>{flash=!flash;e.currentTarget.setAttribute('aria-pressed',flash);renderV()};
$('todoB').onclick=e=>{todo=!todo;e.currentTarget.setAttribute('aria-pressed',todo);renderV()};
$('reset').onclick=()=>{done.clear();ls.set('tk_learned',[]);renderV()};
renderV();
}
</script>
</body>
</html>
