with warm, moist air in the lower layers.", "Tornado Advisories have been issued for the Hokkaido region."], "jp": ["③ 500hPa 5280m付近のトラフ対応の前線を伴った低気圧が日本海北部を東北東進。", "低気圧前面の日本海で、下層暖湿気に対応し激しい雨を解析。", "北海道地方で竜巻注意情報を発表。"]}, {"h": true, "ja": "２．主要じょう乱の予想根拠と防災事項を含む解説上の留意点", "en": ["2. Basis for Forecasting Major Disturbances and Key Explanatory Points Including Disaster Prevention Considerations"], "jp": ["２．主要じょう乱の予想根拠と防災事項を含む解説上の留意点"]}, {"h": false, "ja": "① 28日朝にかけて、1項① の前線上のキンクは伊豆諸島南部付近を通過し、1項② の低気圧は関東地方沿岸へ進む。これらの周辺の東～西日本では、下層暖湿気や上空トラフの影響で大気の状態が非常に不安定となる。関東甲信地方では28日は、土砂災害、低い土地の浸水、河川の増水に注意・警戒。", "en": ["(1) Through the morning of the 28th, the frontal wave (kink) mentioned in Section 1 (1) will pass near the southern Izu Islands, and the low mentioned in Section 1 (2) will advance toward the coast of the Kanto region.", "Around these systems in eastern to western Japan, the atmosphere will become extremely unstable due to the effects of warm, moist air in the lower layers and upper-level troughs.", "In the Kanto-Koshin region on the 28th, be alert to and on high alert for landslides, inundation of low-lying land, and rising river levels."], "jp": ["① 28日朝にかけて、1項① の前線上のキンクは伊豆諸島南部付近を通過し、1項② の低気圧は関東地方沿岸へ進む。", "これらの周辺の東～西日本では、下層暖湿気や上空トラフの影響で大気の状態が非常に不安定となる。", "関東甲信地方では28日は、土砂災害、低い土地の浸水、河川の増水に注意・警戒。"]}, {"h": false, "ja": "② 1項③ の低気圧は28日朝にはオホーツク海へ進み、28日夜にかけて寒冷前線が北日本を通過。寒冷前線の前面となる北日本は下層暖湿気の影響で、大気の状態が非常に不安定となる。", "en": ["(2) The low mentioned in Section 1 (3) will move into the Sea of Okhotsk by the morning of the 28th, and a cold front will pass across northern Japan through the night of the 28th.", "In northern Japan ahead of the cold front, the atmosphere will become extremely unstable due to the influence of warm, moist air in the lower layers."], "jp": ["② 1項③ の低気圧は28日朝にはオホーツク海へ進み、28日夜にかけて寒冷前線が北日本を通過。", "寒冷前線の前面となる北日本は下層暖湿気の影響で、大気の状態が非常に不安定となる。"]}, {"h": false, "ja": "③ 2項① ② の低気圧は、28日夜にかけて発達しながらオホーツク海や日本の東に進み、その後29日にかけて、日本付近は大陸の高気圧との間で西高東低の気圧配置が一時的に強まる。30日は高気圧が日本の南から日本の東へ移動するが、次の低気圧が日本海北部に進み、北～東日本は気圧の傾きが大きくなる。これらの影響で全国的に風が強く吹き、波が高くなり、しける所が多くなる。西日本では28日は暴風に警戒し、29日にかけて高波に注意・警戒。北日本では29日にかけて、強風や高波に注意・警戒。北～東日本では30日にかけて、西日本と南西諸島では29日にかけて、強風や高波に注意。", "en": ["(3) The lows mentioned in Section 2 (1) and (2) will advance toward the Sea of Okhotsk and east of Japan while developing through the night of the 28th; subsequently through the 29th, a winter-type pressure pattern (high to the west and low to the east) will temporarily intensify over Japan between these lows and continental high pressure.", "On the 30th, although the anticyclone will move from south of Japan to east of Japan, the next low will move into the northern Sea of Japan, increasing the pressure gradient across northern to eastern Japan.", "Under these influences, strong winds will blow and waves will become high nationwide, leading to stormy seas in many areas.", "In western Japan, be on high alert for gale-force/violent winds on the 28th, and watch for and be on high alert for high waves through the 29th.", "In northern Japan, watch for and be on high alert for strong winds and high waves through the 29th.", "In northern to eastern Japan through the 30th, and in western Japan and the Nansei Islands through the 29th, watch for strong winds and high waves."], "jp": ["③ 2項① ② の低気圧は、28日夜にかけて発達しながらオホーツク海や日本の東に進み、その後29日にかけて、日本付近は大陸の高気圧との間で西高東低の気圧配置が一時的に強まる。", "30日は高気圧が日本の南から日本の東へ移動するが、次の低気圧が日本海北部に進み、北～東日本は気圧の傾きが大きくなる。", "これらの影響で全国的に風が強く吹き、波が高くなり、しける所が多くなる。", "西日本では28日は暴風に警戒し、29日にかけて高波に注意・警戒。", "北日本では29日にかけて、強風や高波に注意・警戒。", "北～東日本では30日にかけて、西日本と南西諸島では29日にかけて、強風や高波に注意。"]}, {"h": false, "ja": "④ 29日にかけて、500hPa 5160m～5580mの寒気を伴う深いトラフが本州を通過し、北～西日本の上空500hPaには平年より10℃程度低い寒気が流れ込む。地上では2項① ② の低気圧や前線が通過した後、29日前半にかけて日本海にシアーラインが顕在化し、下層風が収束するシアーライン付近を中心に、上空寒気の影響で大気の状態が非常に不安定となる。2項① ② の要因と合わせて、北日本では30日にかけて、東～西日本では29日にかけて、落雷や竜巻などの激しい突風、降ひょう、急な強い雨に注意。", "en": ["(4) Through the 29th, a deep trough with cold air accompanied by 500-hPa geopotential heights of 5,160–5,580 m will pass over Honshu, and cold air about 10°C lower than normal will flow into the upper levels at 500 hPa over northern to western Japan.", "At the surface, following the passage of the lows and fronts mentioned in Section 2 (1) and (2), a shear line will become prominent over the Sea of Japan through the first half of the 29th; mainly near this shear line where lower-level winds converge, the atmosphere will become extremely unstable due to the effect of upper-level cold air.", "Combined with the factors in Section 2 (1) and (2), watch for lightning strikes, severe gusts including tornadoes, hail, and sudden downpours in northern Japan through the 30th and in eastern to western Japan through the 29th."], "jp": ["④ 29日にかけて、500hPa 5160m～5580mの寒気を伴う深いトラフが本州を通過し、北～西日本の上空500hPaには平年より10℃程度低い寒気が流れ込む。", "地上では2項① ② の低気圧や前線が通過した後、29日前半にかけて日本海にシアーラインが顕在化し、下層風が収束するシアーライン付近を中心に、上空寒気の影響で大気の状態が非常に不安定となる。", "2項① ② の要因と合わせて、北日本では30日にかけて、東～西日本では29日にかけて、落雷や竜巻などの激しい突風、降ひょう、急な強い雨に注意。"]}, {"h": false, "ja": "⑤ 850hPa -6℃以下の寒気が29日の日中をピークに北日本中心に流れ込み、東日本では山地中心に、北日本は平地を含めて降雪となる所がある。北～東日本では29日は、大雪や着雪による交通障害に注意。多雪地では29日にかけてなだれにも注意。2項④ のシアーラインは29日夜には不明瞭化するが、28日からの降雨量が北陸地方中心に多くなる。北～東日本では29日にかけて、土砂災害に注意・警戒。", "en": ["(5) Cold air of -6°C or lower at 850 hPa will flow in mainly over northern Japan, peaking during the daytime on the 29th, and snowfall will occur mainly in mountainous areas in eastern Japan and across northern Japan including plains.", "In northern to eastern Japan on the 29th, watch for traffic disruptions caused by heavy snow and snow accretion.", "In snowy areas, also watch for avalanches through the 29th.", "Although the shear line mentioned in Section 2 (4) will obscure by the night of the 29th, cumulative rainfall since the 28th will become substantial, centered on the Hokuriku region.", "In northern to eastern Japan through the 29th, be alert to and on high alert for landslides."], "jp": ["⑤ 850hPa -6℃以下の寒気が29日の日中をピークに北日本中心に流れ込み、東日本では山地中心に、北日本は平地を含めて降雪となる所がある。", "北～東日本では29日は、大雪や着雪による交通障害に注意。", "多雪地では29日にかけてなだれにも注意。", "2項④ のシアーラインは29日夜には不明瞭化するが、28日からの降雨量が北陸地方中心に多くなる。", "北～東日本では29日にかけて、土砂災害に注意・警戒。"]}, {"h": true, "ja": "３．数値予報資料解釈上の留意点", "en": ["3. Key Points in Interpreting Numerical Weather Prediction Guidance"], "jp": ["３．数値予報資料解釈上の留意点"]}, {"h": false, "ja": "総観場はGSMを基本、量的予想や降水分布はMSMやLFMも参考。", "en": ["The synoptic field is primarily based on the GSM, with the MSM and LFM also referenced for quantitative forecasts and precipitation distribution."], "jp": ["総観場はGSMを基本、量的予想や降水分布はMSMやLFMも参考。"]}, {"h": true, "ja": "４．防災関連事項", "en": ["4. Disaster Prevention Matters"], "jp": ["４．防災関連事項"]}, {"h": false, "ja": "[量的予報等] ① 雨量(06時からの24時間)：北陸100mm。② 波浪(明日まで)：伊豆諸島5、全国的に4～3m。", "en": ["[Quantitative Forecasts, etc.] (1) Precipitation (24 hours from 06:00): Hokuriku 100 mm.", "(2) Ocean waves (through tomorrow): Izu Islands 5 m, nationwide 4 to 3 m."], "jp": ["[量的予報等] ① 雨量(06時からの24時間)：北陸100mm。", "② 波浪(明日まで)：伊豆諸島5、全国的に4～3m。"]}, {"h": true, "ja": "５．全般気象解説情報発表の有無", "en": ["5. Schedule for Issuance of General Weather Discussion Information"], "jp": ["５．全般気象解説情報発表の有無"]}, {"h": false, "ja": "「落雷・突風・降ひょう」を5時頃に発表予定。", "en": ["Information on \"Lightning, Gusts, and Hail\" is scheduled to be issued around 05:00."], "jp": ["「落雷・突風・降ひょう」を5時頃に発表予定。"]}, {"h": false, "ja": "（注）量的な予報については、今後の状況により変化する場合がありますので、注意報・警報や全般気象情報等に記述する数値を利用願います。", "en": ["(Note) Quantitative forecasts are subject to change depending on subsequent conditions, so please refer to values stated in advisories, warnings, and general weather info bulletins."], "jp": ["（注）量的な予報については、今後の状況により変化する場合がありますので、注意報・警報や全般気象情報等に記述する数値を利用願います。"]}], "times": [0.0, 2.73, 14.19, 26.37, 32.86, 35.06, 47.78, 56.63, 60.88, 69.65, 84.41, 96.36, 106.82, 119.24, 129.41, 151.9, 165.62, 174.05, 184.85, 191.59, 201.62, 224.15, 246.32, 261.91, 281.14, 289.33, 293.88, 306.32, 312.78, 317.28, 328.23, 330.86, 341.12, 347.86, 352.54, 359.6], "vtimes": [[0.0, 9.14], [9.44, 17.34], [17.64, 22.56], [22.86, 28.65], [28.95, 33.46], [33.76, 38.44], [38.7 let auto=!!ls.get('tk_auto',false);$('autoB').setAttribute('aria-pressed',auto);
$('autoB').onclick=e=>{auto=!auto;e.currentTarget.setAttribute('aria-pressed',auto);ls.set('tk_auto',auto);if(auto&&!A.paused&&spans[last])spans[last].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});where()};
let rate=+ls.get('tk_rate',1);$('rate').value=String(rate);A.playbackRate=rate;
if(!HAS){$('pt').textContent='この号の音声は保存期間（1か月）を過ぎました';['play','prev','next','rate'].forEach(i=>$(i).disabled=true)}
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const mark=i=>{if(i===last)return;last=i;spans.forEach(s=>s.classList.toggle('on',+s.dataset.i===i));if(auto&&tab==='read'&&!A.paused&&spans[i])spans[i].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});$('pt').innerHTML=`<b>${i+1} / ${S.length}</b>`;jps.forEach(e=>e.classList.toggle('jon',i>=+e.dataset.a&&i<=+e.dataset.b));cap(i);where()};
const jps=[...document.querySelectorAll('.jp')];
let words=[],wlen=[],wdone=-1,wline=-1;
const cap=i=>{const ws=S[i].split(/\s+/).filter(Boolean);$('now').innerHTML=`<div class="tx" id="tx">${ws.map(w=>`<i>${esc(w)}</i>`).join(' ')}</div>`;words=[...$('tx').children];let c=0;wlen=ws.map(w=>c+=w.length+1);wdone=-1;wline=-1;kara()};
const where=()=>{const h=$('here');const el=spans[last];if(tab!=='read'||last<0||!el||(A.paused&&!A.currentTime)){h.hidden=true;return}const r=el.getBoundingClientRect(),top=document.querySelector('header').getBoundingClientRect().bottom,bot=document.querySelector('.bar').getBoundingClientRect().top;if(r.bottom<top+4){h.textContent=`↑ 読み上げ中（${last+1}/${S.length}）`;h.hidden=false}else if(r.top>bot-4){h.textContent=`↓ 読み上げ中（${last+1}/${S.length}）`;h.hidden=false}else h.hidden=true};
let wq=0;addEventListener('scroll',()=>{if(wq)return;wq=requestAnimationFrame(()=>{wq=0;where()})},{passive:true});addEventListener('resize',where);
$('here').onclick=()=>{spans[last]&&spans[last].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'})};
const idx=t=>{let i=0;while(i+1<T.length&&T[i+1]<=t+0.05)i++;return i};
A.ontimeupdate=()=>{if(A.seeking)return;cur=idx(A.currentTime);mark(cur);$('pb').style.width=(A.duration?A.currentTime/A.duration*100:0)+'%'};
const icon=p=>{$('pi').innerHTML=p?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';$('play').setAttribute('aria-label',p?'一時停止':'再生')};
A.onplay=()=>{icon(true);VA.pause();loop()};A.onpause=A.onended=()=>icon(false);
let raf=0;const kara=()=>{const tx=$('tx');if(!tx||last<0||!words.length)return;const st=T[last],en=last+1<T.length?T[last+1]-0.45:(A.duration||st+5);const f=Math.max(0,Math.min(1,(A.currentTime-st)/Math.max(0.3,en-st)));const tot=wlen[wlen.length-1];let k=0;while(k<wlen.length-1&&wlen[k]<=f*tot)k++;if(f<=0.001)k=-1;else if(f>=0.999)k=words.length-1;if(k!==wdone){words.forEach((w,j)=>w.classList.toggle('d',j<=k));wdone=k}const cur=words[Math.max(0,Math.min(words.length-1,k+1))]||words[0];const top=cur.offsetTop;if(top!==wline){tx.style.transform=`translateY(${-top}px)`;wline=top}};
const loop=()=>{cancelAnimationFrame(raf);const step=()=>{kara();if(!A.paused)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)};
const seek=t=>{if(A.readyState>=1)A.currentTime=t;else A.addEventListener('loadedmetadata',()=>{A.currentTime=t},{once:true})};
const go=i=>{i=Math.max(0,Math.min(S.length-1,i));seek(T[i]);cur=i;last=-1;mark(i);A.play().catch(()=>{})};
$('play').onclick=()=>A.paused?A.play().catch(()=>{}):A.pause();
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
spans.forEach(s=>s.onclick=()=>go(+s.dataset.i));
$('rate').onchange=e=>{rate=+e.target.value;A.playbackRate=rate;
ls.set('tk_rate',rate)};
/* vocab */
let done=new Set(ls.get('tk_learned',[])),flash=false,todo=false,vEnd=0,vBtn=null;
const spk='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9zM16 8a5 5 0 0 1 0 8l-1-1.4a3.3 3.3 0 0 0 0-5.2zM18.5 5a9 9 0 0 1 0 14l-1-1.4a7.2 7.2 0 0 0 0-11.2z"/></svg>';
$('vtab').textContent=`単語帳（${D.vocab.length}）`;
const renderV=()=>{const q=$('q').value.trim().toLowerCase();
  const list=D.vocab.map((v,i)=>({v,i})).filter(({v})=>(!todo||!done.has(v.w))&&(!q||(v.w+v.ja+v.ex).toLowerCase().includes(q)));
  $('vlist').className=flash?'flash':'';
  $('vlist').innerHTML=list.length?list.map(({v,i})=>`<div class="v${done.has(v.w)?' done':''}" data-i="${i}"><div class="vw">${esc(v.w)}</div><div class="vbtn"><button class="say" data-i="${i}" aria-label="${esc(v.w)}の発音">${spk}</button><button class="got" data-i="${i}">${done.has(v.w)?'覚えた✓':'覚えた'}</button></div><div class="vm">${esc(v.pos)} · ${esc(v.ipa)}</div><div class="vb${flash?' hide':''}"><div class="vj">${esc(v.ja)}</div><div class="vx">${esc(v.ex)}</div><div class="vxj">${esc(v.exja)}</div></div></div>`).join(''):'<p class="empty">該当する単語はありません</p>';
  $('cnt').textContent=`${D.vocab.length}語中 ${D.vocab.filter(v=>done.has(v.w)).length}語 覚えた`};
$('vlist').addEventListener('click',e=>{
  const s=e.target.closest('.say'),g=e.target.closest('.got'),c=e.target.closest('.v');
  if(s){if(!HAS)return;const i=+s.dataset.i;A.pause();if(vBtn)vBtn.classList.remove('play');if(vBtn===s&&!VA.paused){VA.pause();vBtn=null;return}vBtn=s;s.classList.add('play');VA.currentTime=VT[i][0];vEnd=VT[i][1];VA.play().catch(()=>{});return}
  if(g){const w=D.vocab[+g.dataset.i].w;done.has(w)?done.delete(w):done.add(w);ls.set('tk_learned',[...done]);renderV();return}
  if(c&&flash)c.querySelector('.vb').classList.toggle('hide')});
VA.ontimeupdate=()=>{if(VA.currentTime>=vEnd){VA.pause()}};
VA.onpause=()=>{if(vBtn){vBtn.classList.remove('play');vBtn=null}};
$('q').oninput=renderV;
$('flashB').onclick=e=>{flash=!flash;e.currentTarget.setAttribute('aria-pressed',flash);renderV()};
$('todoB').onclick=e=>{todo=!todo;e.currentTarget.setAttribute('aria-pressed',todo);renderV()};
$('reset').onclick=()=>{done.clear();ls.set('tk_learned',[]);renderV()};
renderV();
}
</script>
</body>
</html>
