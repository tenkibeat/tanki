でいる。東シナ海から西日本は降水を伴う雲バンドがある。", "en": ["(2) The strong-wind axis is stronger at 5,700–5,760 m at 500 hPa, and a jet streak is advancing along the southern coast of Honshu in association with a shortwave trough.", "A cloud band accompanied by precipitation extends from the East China Sea to western Japan."], "jp": ["② 強風軸は500hPa 5700～5760mの方が強く、短波のトラフに伴いジェットストリークが本州南岸を進んでいる。", "東シナ海から西日本は降水を伴う雲バンドがある。"]}, {"h": false, "ja": "③ 北日本中心に風の強まりをもたらした低気圧は千島の東に遠ざかり、風は次第に弱まってきている。沿岸の海域のしけはなくなっているが、北日本と北陸地方では波の高い所がある。", "en": ["(3) The low pressure system that brought strong winds mainly to northern Japan has moved away to the east of the Kuril Islands, and winds are gradually weakening.", "While stormy seas in coastal waters have subsided, waves remain high in parts of northern Japan and the Hokuriku region."], "jp": ["③ 北日本中心に風の強まりをもたらした低気圧は千島の東に遠ざかり、風は次第に弱まってきている。", "沿岸の海域のしけはなくなっているが、北日本と北陸地方では波の高い所がある。"]}, {"h": true, "ja": "２．主要じょう乱の予想根拠と防災事項を含む解説上の留意点", "en": ["2. Basis for Forecasting Major Disturbances and Discussion Points Including Disaster Prevention Considerations"], "jp": ["２．主要じょう乱の予想根拠と防災事項を含む解説上の留意点"]}, {"h": false, "ja": "① 1項① の前線上のキンクは、500hPa 5820m線に沿って進み、28日にかけて本州からやや離れて進む。沖縄近海では前線は28日にかけて徐々に南下。前線近傍では下層暖湿気の影響で大気状態が非常に不安定となり、非常に激しい雨が降り大雨となる所がある。沖縄地方では27日は、土砂災害、低い土地の浸水、河川の増水に注意・警戒。一方、1項① のトラフ接近に伴い1項② の強風軸に対応して27日夜には四国沖に低気圧が発生し、28日朝には関東地方沿岸を通って、発達しながら北東に進む。この低気圧の周辺では高気圧西側を北上する下層暖湿気、トラフ前面の上昇流や上空の寒気の影響で大気の状態が非常に不安定となる見込み。", "en": ["(1) The kink on the front mentioned in Section 1 (1) will move along the 5,820 m height line at 500 hPa, tracking slightly offshore of Honshu through the 28th.", "In the seas near Okinawa, the front will gradually move southward through the 28th.", "Near the front, warm, moist air in the lower layers will cause the atmosphere to become very unstable, bringing very heavy downpours and locally heavy rain.", "In the Okinawa region on the 27th, be alert to and on high alert for landslides, inundation of low-lying areas, and rising river waters.", "Meanwhile, with the approach of the trough in Section 1 (1), a low will form off the coast of Shikoku on the night of the 27th corresponding to the strong-wind axis in Section 1 (2), passing along the coast of the Kanto region on the morning of the 28th and tracking northeastward while developing.", "Around this low, the atmosphere is expected to become very unstable due to lower-level warm and moist air northward along the western periphery of the anticyclone, upward vertical motion ahead of the trough, and cold air aloft."], "jp": ["① 1項① の前線上のキンクは、500hPa 5820m線に沿って進み、28日にかけて本州からやや離れて進む。", "沖縄近海では前線は28日にかけて徐々に南下。", "前線近傍では下層暖湿気の影響で大気状態が非常に不安定となり、非常に激しい雨が降り大雨となる所がある。", "沖縄地方では27日は、土砂災害、低い土地の浸水、河川の増水に注意・警戒。", "一方、1項① のトラフ接近に伴い1項② の強風軸に対応して27日夜には四国沖に低気圧が発生し、28日朝には関東地方沿岸を通って、発達しながら北東に進む。", "この低気圧の周辺では高気圧西側を北上する下層暖湿気、トラフ前面の上昇流や上空の寒気の影響で大気の状態が非常に不安定となる見込み。"]}, {"h": false, "ja": "② 1項① のトラフの深まりに伴い500hPa 5340m付近の強風軸に沿って、前線を伴った低気圧が28日にはオホーツク海を発達しながら北東に進み、寒冷前線が北日本を通過する。", "en": ["(2) Associated with the deepening of the trough in Section 1 (1), a low pressure system accompanied by fronts will move northeastward over the Sea of Okhotsk on the 28th while intensifying along the strong-wind axis near 5,340 m at 500 hPa, and its cold front will pass through northern Japan."], "jp": ["② 1項① のトラフの深まりに伴い500hPa 5340m付近の強風軸に沿って、前線を伴った低気圧が28日にはオホーツク海を発達しながら北東に進み、寒冷前線が北日本を通過する。"]}, {"h": false, "ja": "③ 以上の発達する低気圧や前線からなる深い気圧の谷が28日前半には本州付近を通過。後半には日本の東に進み、華中に中心をもつ高気圧との間で、29日にかけて西高東低の気圧配置となる。全国的に風が強く吹き、波が高くなり、外海はしける所が多くなる。27日は北・東日本と前線に近い南西諸島で、28～29日は全国的に、強風や高波に注意。850hPa -6℃以下の寒気が29日の日中をピークに北日本中心に流れ込み、北日本は平地を含めて降雪、東日本では山地中心に雪となる所がある。北日本では29日は、大雪や着雪による交通障害に注意。多雪地では29日にかけてなだれにも注意。日本海の収束線は29日前半にかけて南下して不明瞭化するが、28日からの降雨量が北陸地方中心に多くなる。東～北日本では28～29日は、これまでの大雨で地盤の緩んでいる地域を中心に土砂災害に注意。", "en": ["(3) A deep trough of low pressure consisting of the developing low pressure systems and fronts mentioned above will cross near Honshu in the first half of the 28th.", "In the latter half, it will move he cold air aloft.", "Combined with factors (1) through (3), watch for lightning, wind gusts, hail, sudden torrential rain, and localized violent gusts such as tornadoes in the Nansei Islands on the 27th, and across western to northern Japan through the 29th."], "jp": ["④ 深いトラフは強い寒気を伴って、29日初めには西日本を、昼頃には北・東日本を通過し、上空の寒気の影響で大気の状態が非常に不安定。", "① ～③ の要因と合わせて、南西諸島では27日は、西～北日本では29日にかけて、落雷、突風、降ひょう、急な強い雨に、局地的には竜巻などの激しい突風に注意。"]}, {"h": true, "ja": "３．数値予報資料解釈上の留意点", "en": ["3. Points to Note in Interpreting Numerical Weather Prediction Guidance"], "jp": ["３．数値予報資料解釈上の留意点"]}, {"h": false, "ja": "総観場はGSMを基本、量的予想や降水分布はMSMやLFMも参考。", "en": ["The synoptic-scale pattern is based mainly on the GSM, while MSM and LFM are also referenced for quantitative forecasts and precipitation distribution."], "jp": ["総観場はGSMを基本、量的予想や降水分布はMSMやLFMも参考。"]}, {"h": true, "ja": "４．防災関連事項", "en": ["4. Disaster Prevention Items"], "jp": ["４．防災関連事項"]}, {"h": false, "ja": "[量的予報等] ① 雨量(06時からの24時間)：多い所（100mm以上）はない。② 波浪(明日まで)：全国的に4～3m。", "en": ["[Quantitative Forecasts, etc.] (1) Rainfall (24 hours from 06:00): No areas with high amounts (100 mm or more).", "(2) Waves (through tomorrow): 4 to 3 m nationwide."], "jp": ["[量的予報等] ① 雨量(06時からの24時間)：多い所（100mm以上）はない。", "② 波浪(明日まで)：全国的に4～3m。"]}, {"h": true, "ja": "５．全般気象解説情報発表の有無", "en": ["5. Schedule for Issuance of General Weather Information"], "jp": ["５．全般気象解説情報発表の有無"]}, {"h": false, "ja": "発表の予定はない。", "en": ["No issuance is planned."], "jp": ["発表の予定はない。"]}, {"h": false, "ja": "（注）量的な予報については、今後の状況により変化する場合がありますので、注意報・警報や全般気象情報等に記述する数値を利用願います。", "en": ["(Note) Quantitative forecasts are subject to change depending on future developments; please refer to the numerical values stated in weather advisories, warnings, and General Weather Information."], "jp": ["（注）量的な予報については、今後の状況により変化する場合がありますので、注意報・警報や全般気象情報等に記述する数値を利用願います。"]}], "times": [0.0, 3.18, 22.6, 37.49, 53.41, 60.08, 70.58, 79.1, 87.29, 101.18, 106.49, 116.95, 127.32, 147.2, 162.67, 184.99, 195.77, 208.74, 216 /* main audio */
const spans=[...document.querySelectorAll('.s')];let cur=0,last=-1;
let auto=!!ls.get('tk_auto',false);$('autoB').setAttribute('aria-pressed',auto);
$('autoB').onclick=e=>{auto=!auto;e.currentTarget.setAttribute('aria-pressed',auto);ls.set('tk_auto',auto);if(auto&&!A.paused&&spans[last])spans[last].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});where()};
let rate=+ls.get('tk_rate',1);$('rate').value=String(rate);A.playbackRate=rate;
if(!HAS){$('pt').textContent='この号の音声は保存期間（1か月）を過ぎました';['play','prev','next','rate'].forEach(i=>$(i).disabled=true)}
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const mark=i=>{if(i===last)return;last=i;spans.forEach(s=>s.classList.toggle('on',+s.dataset.i===i));if(auto&&tab==='read'&&!A.paused&&spans[i])spans[i].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});$('pt').innerHTML=`<b>${i+1} / ${S.length}</b>`;jps.forEach(e=>e.classList.toggle('jon',i>=+e.dataset.a&&i<=+e.dataset.b));cap(i);where()};
const jps=[...document.querySelectorAll('.jp')];
let words=[],wlen=[],wdone=-1,wline=-1;
const cap=i=>{const ws=S[i].split(/\s+/).filter(Boolean);$('now').innerHTML=`<div class="tx" id="tx">${ws.map(w=>`<i>${esc(w)}</i>`).join(' ')}</div>`;words=[...$('tx').children];let c=0;wlen=ws.map(w=>c+=w.length+1);wdone=-1;wline=-1;kara()};
const where=()=>{const h=$('here');const el=spans[last];if(tab!=='read'||last<0||!el||(A.paused&&!A.currentTime)){h.hidden=true;return}const r=el.getBoundingClientRect(),top=document.querySelector('header').getBoundingClientRect().bottom,bot=document.querySelector('.bar').getBoundingClientRect().top;if(r.bottom<top+4){h.textContent=`↑ 読み上げ中（${last+1}/${S.length}）`;h.hidden=false}else if(r.top>bot-4){h.textContent=`↓ 読み上げ中（${last+1}/${S.length}）`;h.hidden=false}else h.hidden=true};
let wq=0;addEventListener('scroll',()=>{if(wq)return;wq=requestAnimationFrame(()=>{wq=0;where()})},{passive:true});addEventListener('resize',where);
$('here').onclick=()=>{spans[last]&&spans[last].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'})};
const idx=t=>{let i=0;while(i+1<T.length&&T[i+1]<=t+0.05)i++;return i};
A.ontimeupdate=()=>{if(A.seeking)return;cur=idx(A.currentTime);mark(cur);$('pb').style.width=(A.duration?A.currentTime/A.duration*100:0)+'%'};
const icon=p=>{$('pi').innerHTML=p?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';$('play').setAttribute('aria-label',p?'一時停止':'再生')};
A.onplay=()=>{icon(true);VA.pause();loop()};A.onpause=A.onended=()=>icon(false);
let raf=0;const kara=()=>{const tx=$('tx');if(!tx||last<0||!words.length)return;const st=T[last],en=last+1<T.length?T[last+1]-0.45:(A.duration||st+5);const f=Math.max(0,Math.min(1,(A.currentTime-st)/Math.max(0.3,en-st)));const tot=wlen[wlen.length-1];let k=0;while(k<wlen.length-1&&wlen[k]<=f*tot)k++;if(f<=0.001)k=-1;else if(f>=0.999)k=words.length-1;if(k!==wdone){words.forEach((w,j)=>w.classList.toggle('d',j<=k));wdone=k}const cur=words[Math.max(0,Math.min(words.length-1,k+1))]||words[0];const top=cur.offsetTop;if(top!==wline){tx.style.transform=`translateY(${-top}px)`;wline=top}};
const loop=()=>{cancelAnimationFrame(raf);const step=()=>{kara();if(!A.paused)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)};
const seek=t=>{if(A.readyState>=1)A.currentTime=t;else A.addEventListener('loadedmetadata',()=>{A.currentTime=t},{once:true})};
const go=i=>{i=Math.max(0,Math.min(S.length-1,i));seek(T[i]);cur=i;last=-1;mark(i);A.play().catch(()=>{})};
$('play').onclick=()=>A.paused?A.play().catch(()=>{}):A.pause();
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
spans.forEach(s=>s.onclick=()=>go(+s.dataset.i));
$('rate').onchange=e=>{rate=+e.target.value;A.playbackRate=rate;
ls.set('tk_rate',rate)};
/* vocab */
let done=new Set(ls.get('tk_learned',[])),flash=false,todo=false,vEnd=0,vBtn=null;
const spk='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9zM16 8a5 5 0 0 1 0 8l-1-1.4a3.3 3.3 0 0 0 0-5.2zM18.5 5a9 9 0 0 1 0 14l-1-1.4a7.2 7.2 0 0 0 0-11.2z"/></svg>';
$('vtab').textContent=`単語帳（${D.vocab.length}）`;
const renderV=()=>{const q=$('q').value.trim().toLowerCase();
  const list=D.vocab.map((v,i)=>({v,i})).filter(({v})=>(!todo||!done.has(v.w))&&(!q||(v.w+v.ja+v.ex).toLowerCase().includes(q)));
  $('vlist').className=flash?'flash':'';
  $('vlist').innerHTML=list.length?list.map(({v,i})=>`<div class="v${done.has(v.w)?' done':''}" data-i="${i}"><div class="vw">${esc(v.w)}</div><div class="vbtn"><button class="say" data-i="${i}" aria-label="${esc(v.w)}の発音">${spk}</button><button class="got" data-i="${i}">${done.has(v.w)?'覚えた✓':'覚えた'}</button></div><div class="vm">${esc(v.pos)} · ${esc(v.ipa)}</div><div class="vb${flash?' hide':''}"><div class="vj">${esc(v.ja)}</div><div class="vx">${esc(v.ex)}</div><div class="vxj">${esc(v.exja)}</div></div></div>`).join(''):'<p class="empty">該当する単語はありません</p>';
  $('cnt').textContent=`${D.vocab.length}語中 ${D.vocab.filter(v=>done.has(v.w)).length}語 覚えた`};
$('vlist').addEventListener('click',e=>{
  const s=e.target.closest('.say'),g=e.target.closest('.got'),c=e.target.closest('.v');
  if(s){if(!HAS)return;const i=+s.dataset.i;A.pause();if(vBtn)vBtn.classList.remove('play');if(vBtn===s&&!VA.paused){VA.pause();vBtn=null;return}vBtn=s;s.classList.add('play');VA.currentTime=VT[i][0];vEnd=VT[i][1];VA.play().catch(()=>{});return}
  if(g){const w=D.vocab[+g.dataset.i].w;done.has(w)?done.delete(w):done.add(w);ls.set('tk_learned',[...done]);renderV();return}
  if(c&&flash)c.querySelector('.vb').classList.toggle('hide')});
VA.ontimeupdate=()=>{if(VA.currentTime>=vEnd){VA.pause()}};
VA.onpause=()=>{if(vBtn){vBtn.classList.remove('play');vBtn=null}};
$('q').oninput=renderV;
$('flashB').onclick=e=>{flash=!flash;e.currentTarget.setAttribute('aria-pressed',flash);renderV()};
$('todoB').onclick=e=>{todo=!todo;e.currentTarget.setAttribute('aria-pressed',todo);renderV()};
$('reset').onclick=()=>{done.clear();ls.set('tk_learned',[]);renderV()};
renderV();
}
</script>
</body>
</html>
