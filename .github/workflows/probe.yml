name: probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -o t.pdf -w "%{http_code} %{size_download}\n" https://www.data.jma.go.jp/yoho/data/jishin/kaisetsu_tanki_latest.pdf
          file t.pdf
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1 || true
          pdfinfo t.pdf
          pdftotext -layout t.pdf - | head -80
          curl -sSL -o /dev/null -w "dir %{http_code}\n" https://www.data.jma.go.jp/yoho/data/jishin/
