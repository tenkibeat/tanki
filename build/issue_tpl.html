<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%%PTITLE%%</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm forecast-desk study sheet
   IDEA: JMA forecast discussion you can listen to while flipping to the chart
   PICTURE: the surface chart tab; the reading tab is the working thing
   COLOUR and TYPE: white sheet, ink, sea blue English, warning red for the live sentence; Archivo + Noto Sans JP
   LAYOUT: sticky title + tabs on top, one reading column, sticky player at bottom */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1217);--ink:light-dark(#10131a,#e8ebf0);--mute:light-dark(#5b6270,#9aa3b2);--line:light-dark(#e3e6eb,#252b35);--blue:light-dark(#0b4f8a,#7fb6ea);--red:light-dark(#c1121f,#ff6b72);--hl:light-dark(#fff1c2,#3a3112);--card:light-dark(#f5f7fa,#171c24);--ok:light-dark(#2f7a4a,#6fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;padding:0 max(4vw,16px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-top:5px solid var(--ink);border-bottom:1px solid var(--line)}
.ht{padding:8px 0 0}.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.arc{flex:none;font:600 14px "Noto Sans JP",sans-serif;color:var(--blue);text-decoration:none;padding:8px 0}
h1{font:800 18px/1.25 Archivo,"Noto Sans JP",sans-serif;font-stretch:105%;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:13px;margin:2px 0 0}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:6px}
.tab{all:unset;cursor:pointer;text-align:center;font:600 15px "Noto Sans JP",sans-serif;color:var(--mute);min-height:40px;line-height:40px;border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--red)}
.tab:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.panel{display:none;padding-top:14px}.panel.on{display:block}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}.mbar{display:flex;align-items:center;gap:6px;padding:6px 0 7px}.mbar[hidden]{display:none}.seg{flex:1;display:grid;grid-template-columns:1.35fr 1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.seg button{all:unset;cursor:pointer;text-align:center;font:500 12.5px/30px "Noto Sans JP",sans-serif;color:var(--mute);white-space:nowrap}.seg button+button{border-left:1px solid var(--line)}.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}.auto{flex:none;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:500 12px "Noto Sans JP",sans-serif;white-space:nowrap}.auto[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}.seg button:focus-visible,.auto:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.pill{font:500 14px "Noto Sans JP",sans-serif;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font:700 17px/1.45 "Noto Sans JP",sans-serif;margin:26px 0 4px;padding-top:12px;border-top:2px solid var(--ink)}
.h-en{display:block;font:600 15px/1.4 Archivo,sans-serif;color:var(--blue);margin-bottom:4px}
.ja{margin:14px 0 4px}
.en{margin:0 0 6px;font:17px/1.7 Archivo,sans-serif;color:var(--blue)}
.s{cursor:pointer;border-radius:3px;transition:background .2s}
.s.on{background:var(--hl);color:var(--ink);box-shadow:-3px 0 0 var(--red)}
.rv{font:500 13px "Noto Sans JP",sans-serif;min-height:36px;padding:0 12px;border-radius:18px;border:1px dashed var(--line);background:none;color:var(--blue);margin:2px 0 8px;display:none}
body.m-en .ja:not(.show),body.m-ja .en:not(.show),body.m-ja .h-en:not(.show){display:none}
body.m-en .rv.for-ja,body.m-ja .rv.for-en{display:inline-block}
.note{font-size:13px;color:var(--mute);margin:26px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.note a{color:var(--blue)}
.chart{border:1px solid var(--line);border-radius:6px;overflow:auto;background:#fff;-webkit-overflow-scrolling:touch}
.chart img{display:block;width:100%;height:auto}
.chart.big img{width:220%;max-width:none}
.leg{list-style:none;padding:0;margin:14px 0 0}
.leg li{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.leg b{font:700 15px Archivo,"Noto Sans JP",sans-serif}
.back{margin-top:16px}
input[type=search]{width:100%;font:16px "Noto Sans JP",sans-serif;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
.cnt{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin:6px 0 4px}
.cnt button{all:unset;cursor:pointer;color:var(--blue);font-size:13px;padding:8px 0}
.v{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.v.done .vw{color:var(--ok)}
.vw{font:700 18px/1.3 Archivo,sans-serif;color:var(--blue)}
.vm{font-size:13px;color:var(--mute)}
.vb{grid-column:1/-1}
.vb.hide{display:none}
.vj{font-size:15px}.vx{font:15px/1.5 Archivo,sans-serif;margin-top:2px}.vxj{font-size:13px;color:var(--mute)}
.vbtn{display:flex;gap:8px;grid-row:1/3;grid-column:2;align-items:start}
.say,.got{height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px "Noto Sans JP",sans-serif}
.say{width:44px;display:grid;place-items:center;color:var(--blue)}
.say.play{background:var(--blue);color:var(--bg);border-color:var(--blue)}
.got{padding:0 12px}
.v.done .got{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.flash .v{cursor:pointer}
.empty{color:var(--mute);padding:20px 0;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:8px max(4vw,12px) calc(8px + env(safe-area-inset-bottom))}
.bi{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px}
.bb{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center}
.play-m{width:54px;height:54px;background:var(--red);border-color:var(--red);color:#fff}
.prog{flex:1;font:500 13px Archivo,"Noto Sans JP",sans-serif;color:var(--mute);display:flex;flex-direction:column;gap:4px}#pt{white-space:nowrap}#pt b{color:var(--ink);font-weight:600}.now{max-width:720px;margin:0 auto 6px;font:14px/1.4 Archivo,sans-serif;white-space:nowrap;overflow:hidden;min-height:1.4em}.now:empty{display:none}.now .tx{display:inline-block;will-change:transform;color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(90deg,var(--ink) 0,var(--ink) var(--p,0%),var(--blue) var(--p,0%),var(--blue) 100%);background-color:transparent}.now .tx b{font-weight:inherit}.sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}.here{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));z-index:7;font:600 14px "Noto Sans JP",Archivo,sans-serif;min-height:40px;padding:0 16px;border-radius:20px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.2)}.here[hidden]{display:none}
.track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--red)}
select{font:500 15px Archivo,sans-serif;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 8px}
button{cursor:pointer}button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.s{transition:none}}
</style>
</head>
<body class="m-both">
<header><div class="wrap">
<div class="ht"><div class="top"><h1>%%H1%%</h1><a class="arc" href="../../archive.html">バックナンバー</a></div></div>
<nav class="tabs" role="tablist">
<button class="tab" role="tab" data-t="read" aria-selected="true">対訳</button>
<button class="tab" role="tab" data-t="chart" aria-selected="false">解説図</button>
<button class="tab" role="tab" data-t="vocab" aria-selected="false" id="vtab">単語帳</button>
</nav>
<div class="mbar" id="mbar">
<div class="seg" id="modes" role="group" aria-label="表示">
<button data-m="both" aria-pressed="true">日英どちらも</button><button data-m="en" aria-pressed="false">英語</button><button data-m="ja" aria-pressed="false">日本語</button>
</div>
<button class="auto" id="autoB" aria-pressed="false">自動スクロール</button>
</div>
</div></header>
<div class="wrap">
<section class="panel on" id="p-read">
<p class="sub">%%TEN%%</p>
<main id="body"></main>
<p class="note">原文：%%TJA%%（<a href="%%SRC%%">気象庁</a>）。英訳・単語：%%BY%%。音声：Kokoro（af_heart）。<span id="noaudio"></span></p>
</section>
<section class="panel" id="p-chart">
<div class="pills"><button class="pill" id="zoomB" aria-pressed="false">拡大（横スクロール）</button></div>
<div class="chart" id="chartBox"><img src="chart.jpg" alt="主要じょう乱解説図"></div>
<ul class="leg" id="leg"></ul>
<button class="pill back" id="toRead">読んでいる文に戻る</button>
</section>
<section class="panel" id="p-vocab">
<input type="search" id="q" placeholder="単語・意味で検索" aria-label="単語を検索">
<div class="pills">
<button class="pill" id="flashB" aria-pressed="false">フラッシュカード</button>
<button class="pill" id="todoB" aria-pressed="false">未習得だけ</button>
</div>
<div class="cnt"><span id="cnt"></span><button id="reset">チェックをリセット</button></div>
<div id="vlist"></div>
</section>
</div>
<button class="here" id="here" hidden></button>
<div class="bar"><div class="now" id="now" aria-live="off"></div><div class="bi">
<button class="bb" id="prev" aria-label="前の文"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
<button class="bb play-m" id="play" aria-label="再生"><svg id="pi" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>
<button class="bb" id="next" aria-label="次の文"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
<div class="prog"><span id="pt">英文をタップでそこから再生</span><div class="track"><i id="pb"></i></div></div>
<select id="rate" aria-label="速さ"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option></select>
</div></div>
<script>
{
const D=%%DATA%%;
const T=D.times||[],VT=D.vtimes||[],HAS=!!D.audio;
const A=new Audio(HAS?'audio.mp3':''),VA=new Audio(HAS?'vocab.mp3':'');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* reading */
const S=[];let h='';
D.secs.forEach(x=>{
  const en=x.en.map(t=>{S.push(t);return `<span class="s" data-i="${S.length-1}">${esc(t)}</span>`}).join(' ');
  h+=x.h?`<h2>${esc(x.ja)}<span class="h-en">${en}</span></h2>`
   :`<p class="ja">${esc(x.ja)}</p><button class="rv for-ja">和訳を見る</button><p class="en">${en}</p><button class="rv for-en">英訳を見る</button>`;
});
$('body').innerHTML=h;
$('body').addEventListener('click',e=>{const b=e.target.closest('.rv');if(!b)return;const p=b.classList.contains('for-ja')?b.previousElementSibling:b.previousElementSibling;p.classList.toggle('show');b.textContent=p.classList.contains('show')?'隠す':(b.classList.contains('for-ja')?'和訳を見る':'英訳を見る')});
const setMode=m=>{document.body.className='m-'+m;document.querySelectorAll('#modes [data-m]').forEach(p=>p.setAttribute('aria-pressed',p.dataset.m===m));document.querySelectorAll('.show').forEach(x=>x.classList.remove('show'));document.querySelectorAll('.rv').forEach(b=>b.textContent=b.classList.contains('for-ja')?'和訳を見る':'英訳を見る');ls.set('tk_mode',m)};
document.querySelectorAll('#modes [data-m]').forEach(p=>p.onclick=()=>setMode(p.dataset.m));
setMode(ls.get('tk_mode','both'));
/* tabs */
const pos={read:0,chart:0,vocab:0};let tab='read';
const show=t=>{if(t===tab)return;pos[tab]=scrollY;tab=t;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));$('mbar').hidden=t!=='read';
  if(t==='read'&&!A.paused&&auto){spans[cur]&&spans[cur].scrollIntoView({block:'center'})}else scrollTo(0,pos[t]);where()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.t));
$('toRead').onclick=()=>{show('read');spans[cur]&&spans[cur].scrollIntoView({block:'center'})};
/* chart */
$('leg').innerHTML=D.legend.map(l=>`<li><b>${esc(l[0])}</b><span>${esc(l[1])}</span></li>`).join('');
$('zoomB').onclick=e=>{const on=$('chartBox').classList.toggle('big');e.currentTarget.setAttribute('aria-pressed',on)};
/* main audio */
const spans=[...document.querySelectorAll('.s')];let cur=0,last=-1;
let auto=!!ls.get('tk_auto',false);$('autoB').setAttribute('aria-pressed',auto);
$('autoB').onclick=e=>{auto=!auto;e.currentTarget.setAttribute('aria-pressed',auto);ls.set('tk_auto',auto);if(auto&&!A.paused&&spans[last])spans[last].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});where()};
let rate=+ls.get('tk_rate',1);$('rate').value=String(rate);A.playbackRate=rate;
if(!HAS){$('pt').textContent='この号の音声は保存期間（1か月）を過ぎました';['play','prev','next','rate'].forEach(i=>$(i).disabled=true)}
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const mark=i=>{if(i===last)return;last=i;spans.forEach(s=>s.classList.toggle('on',+s.dataset.i===i));if(auto&&tab==='read'&&!A.paused&&spans[i])spans[i].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});$('pt').innerHTML=`<b>${i+1} / ${S.length}</b>`;$('now').innerHTML=`<span class="tx" id="tx">${esc(S[i])}</span>`;where()};
const where=()=>{const h=$('here');const el=spans[last];if(tab!=='read'||last<0||!el||(A.paused&&!A.currentTime)){h.hidden=true;return}const r=el.getBoundingClientRect(),top=document.querySelector('header').getBoundingClientRect().bottom,bot=document.querySelector('.bar').getBoundingClientRect().top;if(r.bottom<top+4){h.textContent=`↑ 読み上げ中（${last+1}/${S.length}）`;h.hidden=false}else if(r.top>bot-4){h.textContent=`↓ 読み上げ中（${last+1}/${S.length}）`;h.hidden=false}else h.hidden=true};
let wq=0;addEventListener('scroll',()=>{if(wq)return;wq=requestAnimationFrame(()=>{wq=0;where()})},{passive:true});addEventListener('resize',where);
$('here').onclick=()=>{spans[last]&&spans[last].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'})};
const idx=t=>{let i=0;while(i+1<T.length&&T[i+1]<=t+0.05)i++;return i};
A.ontimeupdate=()=>{if(A.seeking)return;cur=idx(A.currentTime);mark(cur);$('pb').style.width=(A.duration?A.currentTime/A.duration*100:0)+'%'};
const icon=p=>{$('pi').innerHTML=p?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';$('play').setAttribute('aria-label',p?'一時停止':'再生')};
A.onplay=()=>{icon(true);VA.pause();loop()};A.onpause=A.onended=()=>icon(false);
let raf=0;const kara=()=>{const tx=$('tx'),box=$('now');if(!tx||last<0)return;const st=T[last],en=last+1<T.length?T[last+1]-0.45:(A.duration||st+5);const f=Math.max(0,Math.min(1,(A.currentTime-st)/Math.max(0.3,en-st)));tx.style.setProperty('--p',(f*100).toFixed(1)+'%');const W=tx.scrollWidth,B=box.clientWidth,x=Math.max(0,Math.min(W-B,f*W-B*0.45));tx.style.transform=`translateX(${-Math.max(0,x)}px)`};
const loop=()=>{cancelAnimationFrame(raf);const step=()=>{kara();if(!A.paused)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)};
const seek=t=>{if(A.readyState>=1)A.currentTime=t;else A.addEventListener('loadedmetadata',()=>{A.currentTime=t},{once:true})};
const go=i=>{i=Math.max(0,Math.min(S.length-1,i));seek(T[i]);cur=i;last=-1;mark(i);A.play().catch(()=>{})};
$('play').onclick=()=>A.paused?A.play().catch(()=>{}):A.pause();
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
spans.forEach(s=>s.onclick=()=>go(+s.dataset.i));
$('rate').onchange=e=>{rate=+e.target.value;A.playbackRate=rate;
ls.set('tk_rate',rate)};
/* vocab */
let done=new Set(ls.get('tk_learned',[])),flash=false,todo=false,vEnd=0,vBtn=null;
const spk='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9zM16 8a5 5 0 0 1 0 8l-1-1.4a3.3 3.3 0 0 0 0-5.2zM18.5 5a9 9 0 0 1 0 14l-1-1.4a7.2 7.2 0 0 0 0-11.2z"/></svg>';
$('vtab').textContent=`単語帳（${D.vocab.length}）`;
const renderV=()=>{const q=$('q').value.trim().toLowerCase();
  const list=D.vocab.map((v,i)=>({v,i})).filter(({v})=>(!todo||!done.has(v.w))&&(!q||(v.w+v.ja+v.ex).toLowerCase().includes(q)));
  $('vlist').className=flash?'flash':'';
  $('vlist').innerHTML=list.length?list.map(({v,i})=>`<div class="v${done.has(v.w)?' done':''}" data-i="${i}"><div class="vw">${esc(v.w)}</div><div class="vbtn"><button class="say" data-i="${i}" aria-label="${esc(v.w)}の発音">${spk}</button><button class="got" data-i="${i}">${done.has(v.w)?'覚えた✓':'覚えた'}</button></div><div class="vm">${esc(v.pos)} · ${esc(v.ipa)}</div><div class="vb${flash?' hide':''}"><div class="vj">${esc(v.ja)}</div><div class="vx">${esc(v.ex)}</div><div class="vxj">${esc(v.exja)}</div></div></div>`).join(''):'<p class="empty">該当する単語はありません</p>';
  $('cnt').textContent=`${D.vocab.length}語中 ${D.vocab.filter(v=>done.has(v.w)).length}語 覚えた`};
$('vlist').addEventListener('click',e=>{
  const s=e.target.closest('.say'),g=e.target.closest('.got'),c=e.target.closest('.v');
  if(s){if(!HAS)return;const i=+s.dataset.i;A.pause();if(vBtn)vBtn.classList.remove('play');if(vBtn===s&&!VA.paused){VA.pause();vBtn=null;return}vBtn=s;s.classList.add('play');VA.currentTime=VT[i][0];vEnd=VT[i][1];VA.play().catch(()=>{});return}
  if(g){const w=D.vocab[+g.dataset.i].w;done.has(w)?done.delete(w):done.add(w);ls.set('tk_learned',[...done]);renderV();return}
  if(c&&flash)c.querySelector('.vb').classList.toggle('hide')});
VA.ontimeupdate=()=>{if(VA.currentTime>=vEnd){VA.pause()}};
VA.onpause=()=>{if(vBtn){vBtn.classList.remove('play');vBtn=null}};
$('q').oninput=renderV;
$('flashB').onclick=e=>{flash=!flash;e.currentTarget.setAttribute('aria-pressed',flash);renderV()};
$('todoB').onclick=e=>{todo=!todo;e.currentTarget.setAttribute('aria-pressed',todo);renderV()};
$('reset').onclick=()=>{done.clear();ls.set('tk_learned',[]);renderV()};
renderV();
}
</script>
</body>
</html>
